---
- name: Enable ipfw
  service:
    name: ipfw
    enabled: yes

- name: Configure firewall_script
  community.general.sysrc:
    name: firewall_script
    value: "/etc/ipfw.rules"

- name: Copy ipfw files
  copy:
    src: "{{ ipfw_rules }}"
    dest: /etc/ipfw.rules
    mode: 0644
    backup: yes
  notify: restart ipfw
