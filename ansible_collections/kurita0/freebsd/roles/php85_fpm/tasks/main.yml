---
- name: be sure php extensions installed
  pkgng:
    name:
      - php85
    state: present

- name: Copy php.ini
  template: src=php.ini.j2 dest=/usr/local/etc/php.ini backup=yes
  notify: restart php-fpm

- name: create /var/log/php-fpm directories
  file: dest=/var/log/php-fpm state=directory owner=www

- name: Copy www.conf
  template:
    src: www.conf.j2
    dest: /usr/local/etc/php-fpm.d/www.conf
    backup: yes
    block_start_string: "{-%"
    block_end_string: "%-}"
  notify: restart php-fpm

- name: Copy php-fpm.conf
  copy: src=newsyslog/php-fpm.conf dest=/usr/local/etc/newsyslog.conf.d/php-fpm.conf

- name: php_fpm.enabled
  service: name=php_fpm enabled=yes

- name: start php-fpm
  service: name=php_fpm state=started
